{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-secondary text-white"><h4>Recuperar Contraseña</h4></div>
            <div class="card-body">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="recovery_token">Pegar Token de Recuperación (Base64/JSON):</label>
                        <input id="recovery_token" type="text" name="token" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-secondary w-100">Procesar Token</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
